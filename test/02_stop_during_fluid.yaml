name: STOP during FLUID_1 switches everything OFF
version: 1
steps:
  - wait-serial: 'STATE: IDLE'
  - set-control: { part-id: btn_start, control: pressed, value: 1 }
  - delay: 100ms
  - set-control: { part-id: btn_start, control: pressed, value: 0 }
  - wait-serial: 'STATE: FLUID_1'
  - set-control: { part-id: btn_flow, control: pressed, value: 1 }
  - wait-serial: 'Flow detected'
  - delay: 1s
  - set-control: { part-id: btn_stop, control: pressed, value: 1 }
  - wait-serial: 'STOP received'
  - expect-pin: { part-id: esp, name: '33', value: 0 }
  - expect-pin: { part-id: esp, name: '25', value: 0 }
  - set-control: { part-id: btn_stop, control: pressed, value: 0 }
  - set-control: { part-id: btn_flow, control: pressed, value: 0 }
  - wait-serial: 'STATE: IDLE'
